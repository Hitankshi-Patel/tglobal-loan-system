version: '3.8'

services:
  # ─── Express Backend API ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tglobal-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/v1/loan-schemes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - tglobal-network

  # ─── Nginx Production Frontend ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tglobal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tglobal-network

  # ─── Optional: Local Ollama Model Runner ──────────────────────────────────
  # Run with: docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    container_name: tglobal-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    profiles:
      - ai
    networks:
      - tglobal-network

networks:
  tglobal-network:
    driver: bridge

volumes:
  ollama-models:
