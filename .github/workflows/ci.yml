name: CI Checks & Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Job 1: Backend Typecheck & Automated Test Suite ────────────────────────
  backend-tests:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Backend TypeScript Check
        run: npx tsc --noEmit -p backend/tsconfig.json

      - name: Run Backend Vitest Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RATE_24K_PER_GRAM: 7000
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: tglobal@admin2024
          JWT_SECRET: test-jwt-secret-key-for-ci
        run: npm run test --workspace=backend

  # ─── Job 2: Frontend Typecheck & Production Build ───────────────────────────
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build --workspace=frontend

  # ─── Job 3: Dockerfile Build Verification ───────────────────────────────────
  docker-validation:
    name: Dockerfile Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Backend Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: tglobal-backend:test

      - name: Test Frontend Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: tglobal-frontend:test
